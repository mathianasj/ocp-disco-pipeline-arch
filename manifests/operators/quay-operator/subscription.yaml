apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: quay-operator
  namespace: openshift-operators
  labels:
    app: disconnected-mirror-pipeline
    component: operator
spec:
  channel: stable-3.11
  name: quay-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

---
# Note: After installing the operator, you'll need to create a QuayRegistry custom resource
# See: https://docs.redhat.com/en/documentation/red_hat_quay
#
# Example QuayRegistry (create in a dedicated namespace):
#
# apiVersion: quay.redhat.com/v1
# kind: QuayRegistry
# metadata:
#   name: mirror-registry
#   namespace: quay-enterprise
# spec:
#   components:
#     - kind: clair
#       managed: true
#     - kind: postgres
#       managed: true
#     - kind: objectstorage
#       managed: true
#     - kind: redis
#       managed: true
#     - kind: horizontalpodautoscaler
#       managed: true
#     - kind: route
#       managed: true
#     - kind: mirror
#       managed: true
#     - kind: monitoring
#       managed: true
#     - kind: tls
#       managed: true
#     - kind: quay
#       managed: true
#     - kind: clairpostgres
#       managed: true
