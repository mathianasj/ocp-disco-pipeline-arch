apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mirror-pipeline-rolebinding
  namespace: mirror-pipeline
  labels:
    app: disconnected-mirror-pipeline
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mirror-pipeline-role
subjects:
  - kind: ServiceAccount
    name: mirror-pipeline-sa
    namespace: mirror-pipeline

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mirror-pipeline-cluster-reader-binding
  labels:
    app: disconnected-mirror-pipeline
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mirror-pipeline-cluster-reader
subjects:
  - kind: ServiceAccount
    name: mirror-pipeline-sa
    namespace: mirror-pipeline
