apiVersion: v1
kind: ServiceAccount
metadata:
  name: mirror-pipeline-sa
  namespace: mirror-pipeline
  labels:
    app: disconnected-mirror-pipeline
    component: rbac

---
# Allow the service account to pull from Red Hat registries
apiVersion: v1
kind: Secret
metadata:
  name: redhat-pull-secret
  namespace: mirror-pipeline
  labels:
    app: disconnected-mirror-pipeline
    component: registry-auth
type: kubernetes.io/dockerconfigjson
# data:
#   .dockerconfigjson: <BASE64_ENCODED_PULL_SECRET>
#
# Create this secret manually with your Red Hat pull secret:
# oc create secret generic redhat-pull-secret \
#   --from-file=.dockerconfigjson=/path/to/pull-secret.json \
#   --type=kubernetes.io/dockerconfigjson \
#   -n mirror-pipeline

---
# Link the pull secret to the service account
apiVersion: v1
kind: Secret
metadata:
  name: mirror-registry-creds
  namespace: mirror-pipeline
  labels:
    app: disconnected-mirror-pipeline
    component: registry-auth
type: kubernetes.io/dockerconfigjson
# data:
#   .dockerconfigjson: <BASE64_ENCODED_MIRROR_REGISTRY_CREDS>
#
# Create this secret manually with your mirror registry credentials:
# oc create secret generic mirror-registry-creds \
#   --from-file=.dockerconfigjson=/path/to/mirror-creds.json \
#   --type=kubernetes.io/dockerconfigjson \
#   -n mirror-pipeline
