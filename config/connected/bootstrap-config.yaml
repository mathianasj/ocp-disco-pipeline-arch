# Bootstrap Configuration
# Settings for creating archives that support fresh OpenShift installations

bootstrap:
  # Include tools needed for installing OpenShift from scratch
  enabled: true

  # OpenShift version to download bootstrap tools for
  # This should match the version in imageset-config.yaml
  ocpVersion: "4.15.12"

  # Tools to include in archive
  tools:
    - openshift-install  # OpenShift installer binary
    - oc                 # OpenShift CLI
    - kubectl            # Kubernetes CLI
    - oc-mirror          # Image mirroring tool
    - mirror-registry    # Tool to install Quay on bastion node
    - helm               # Helm CLI

  # Documentation to include
  documentation:
    - bootstrap-installation.md
    - imageContentSourcePolicy-example.yaml
    - install-config-template.yaml

  # Example install-config template
  # This gets included in the archive for reference
  installConfigTemplate: |
    apiVersion: v1
    baseDomain: example.com
    metadata:
      name: ocp-cluster
    networking:
      networkType: OVNKubernetes
      clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
      serviceNetwork:
      - 172.30.0.0/16
    compute:
    - name: worker
      replicas: 3
    controlPlane:
      name: master
      replicas: 3
    platform:
      # Platform specific config (vsphere, baremetal, etc.)
      none: {}
    pullSecret: '<PULL_SECRET_JSON>'
    sshKey: '<SSH_PUBLIC_KEY>'
    additionalTrustBundle: |
      -----BEGIN CERTIFICATE-----
      <BASTION_REGISTRY_CA_CERT>
      -----END CERTIFICATE-----
    imageContentSources:
    - mirrors:
      - <BASTION_REGISTRY>/openshift/release
      source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
    - mirrors:
      - <BASTION_REGISTRY>/openshift/release-images
      source: quay.io/openshift-release-dev/ocp-release

# Bastion node requirements documentation
bastionRequirements:
  operatingSystem: "RHEL 8.6+ or RHEL 9.0+"
  cpu: "4 cores minimum"
  memory: "16GB minimum"
  storage: "500GB+ available"
  network:
    - "Connectivity to future cluster nodes"
    - "Resolvable hostname by cluster nodes"
    - "Firewall allows registry traffic (port 8443)"

# Installation workflow
workflow:
  steps:
    - name: "Prepare Bastion Node"
      description: "Install RHEL and required packages"
    - name: "Transfer Archive"
      description: "Copy mirror archive to bastion via physical media"
    - name: "Install mirror-registry"
      description: "Set up Quay registry on bastion using mirror-registry tool"
    - name: "Import Content"
      description: "Use bootstrap-import.sh to populate bastion registry"
    - name: "Extract Installer"
      description: "Extract openshift-install binary from archive"
    - name: "Create install-config.yaml"
      description: "Configure installation pointing to bastion registry"
    - name: "Install Cluster"
      description: "Run openshift-install create cluster"
    - name: "Verify Installation"
      description: "Confirm cluster is running and pulling from mirror"
